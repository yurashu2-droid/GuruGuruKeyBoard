name: KurukuruKeyboard
options:
  bundleIdPrefix: com.yurashu2
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  AzooKeyKanaKanjiConverter:
    url: https://github.com/azooKey/AzooKeyKanaKanjiConverter
    exactVersion: "0.11.2"

settings:
  base:
    SWIFT_VERSION: "6.0"

targets:
  KurukuruKeyboard:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yurashu2.gurugurukeyboard
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: くるくるキーボード
        CFBundleShortVersionString: "0.1.5"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - target: KurukuruSafeExtension
        embed: true
      - target: KurukuruMoveExtension
        embed: true
      - target: KurukuruSwiftUIExtension
        embed: true
      - target: KurukuruIMEExtension
        embed: true
    scheme: {}

  KurukuruSafeExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - KeyboardVariants/Safe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yurashu2.gurugurukeyboard.safe
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: GeneratedInfo/Safe-Info.plist
      properties:
        CFBundleDisplayName: くるくる Safe
        CFBundleShortVersionString: "0.1.5"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            PrimaryLanguage: ja-JP
            IsASCIICapable: true
            PrefersRightToLeft: false
            RequestsOpenAccess: false

  KurukuruMoveExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - KeyboardVariants/Move
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yurashu2.gurugurukeyboard.move
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: GeneratedInfo/Move-Info.plist
      properties:
        CFBundleDisplayName: くるくる Move
        CFBundleShortVersionString: "0.1.5"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            PrimaryLanguage: ja-JP
            IsASCIICapable: true
            PrefersRightToLeft: false
            RequestsOpenAccess: false

  KurukuruSwiftUIExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - KeyboardVariants/SwiftUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yurashu2.gurugurukeyboard.swiftui
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: GeneratedInfo/SwiftUI-Info.plist
      properties:
        CFBundleDisplayName: くるくる SwiftUI
        CFBundleShortVersionString: "0.1.5"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            PrimaryLanguage: ja-JP
            IsASCIICapable: true
            PrefersRightToLeft: false
            RequestsOpenAccess: false

  KurukuruIMEExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - KeyboardExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yurashu2.gurugurukeyboard.ime
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: GeneratedInfo/IME-Info.plist
      properties:
        CFBundleDisplayName: くるくる IME
        CFBundleShortVersionString: "0.1.5"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            PrimaryLanguage: ja-JP
            IsASCIICapable: true
            PrefersRightToLeft: false
            RequestsOpenAccess: false
    dependencies:
      - package: AzooKeyKanaKanjiConverter
        product: KanaKanjiConverterModuleWithDefaultDictionary
