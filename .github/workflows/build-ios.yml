name: Build unsigned iOS IPA
on:
  push:
    branches: [main, 'build/**']
    paths-ignore: ['README.md', 'docs/**', 'preview/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi
          xcodegen --version
      - name: Test IPA validator
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Test real Japanese conversion
        shell: bash
        run: |
          set -euo pipefail
          swift test -c release 2>&1 | tee swift-tests.log
      - name: Archive device build and package IPA
        shell: bash
        run: bash scripts/build_ipa.sh
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GuruGuruKeyBoard-unsigned-ipa
          path: |
            build/GuruGuruKeyBoard-unsigned.ipa
            build/ipa-report.json
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            swift-tests.log
            build/xcodebuild.log
            Package.resolved
            KurukuruKeyboard.xcodeproj/project.pbxproj
            KurukuruKeyboard.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if-no-files-found: ignore
          retention-days: 7
